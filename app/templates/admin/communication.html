{% extends "base.html" %}{% block content %}<div class="admin-shell">{% include 'admin/_nav.html' %}<div class="admin-main"><div class="page-head"><div><span class="pill">Communication</span><h1>Student Communication</h1><p>Send official messages and results to individual students.</p></div></div><section class="card"><h2>✉️ Official Student Message</h2><form class="form-grid" method="post" enctype="multipart/form-data" action="{{url_for('send_message')}}"><select name="student_id" required><option value="">Student</option>{% for x in students %}<option value="{{x.id}}">{{x.full_name}} — {{x.specialty or '—'}} — {{x.year or '—'}}</option>{% endfor %}</select><input name="subject" placeholder="Subject" required><textarea name="message" placeholder="Message" required></textarea><input type="file" name="attachment" accept=".pdf,.docx,.jpg,.jpeg,.png"><button class="btn">Send Message</button></form></section><section class="card"><h2>📊 Send Result</h2><form class="form-grid" method="post" enctype="multipart/form-data" action="{{url_for('add_result')}}"><select name="student_id" required><option value="">Student</option>{% for x in students %}<option value="{{x.id}}">{{x.full_name}} — {{x.specialty or '—'}} — {{x.year or '—'}}</option>{% endfor %}</select><select name="course_id"><option value="">Course</option>{% for x in courses %}<option value="{{x.id}}">{{x.name}}</option>{% endfor %}</select><input name="score" placeholder="Score" required><input name="grade" placeholder="Grade" required><input name="semester" placeholder="Semester" required><input name="academic_year" placeholder="Academic year" required><input type="file" name="pdf" accept=".pdf"><button class="btn">Send Result</button></form></section><section class="card"><h2>🤝 Teacher Requests</h2><a class="btn" href="{{url_for('admin_teacher_requests')}}">Review pending teacher chat requests</a></section></div></div>{% endblock %}
