{% extends "base.html" %}{% block content %}<div class="admin-shell">{% include 'admin/_nav.html' %}<div class="admin-main"><div class="page-head"><div><span class="pill">Settings</span><h1>Application Settings</h1><p>Edit the app title, About Us and Contact Us information.</p></div></div><section class="card"><form class="form-grid" method="post" action="{{url_for('update_settings')}}"><input name="app_name" value="{{site.app_name}}" placeholder="Application name"><input name="app_title" value="{{site.app_title or ''}}" placeholder="Application title"><input name="about_title" value="{{about.title}}" placeholder="About title"><textarea name="about_content" placeholder="About content">{{about.content}}</textarea><input name="contact_email" value="{{contact.email or ''}}" placeholder="Contact email"><input name="contact_phone" value="{{contact.phone or ''}}" placeholder="Phone"><input name="contact_address" value="{{contact.address or ''}}" placeholder="Address"><textarea name="contact_content" placeholder="Contact information">{{contact.content or ''}}</textarea><button class="btn">Save Settings</button></form></section></div></div>{% endblock %}
