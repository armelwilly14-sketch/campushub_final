{% extends "base.html" %}{% block content %}<div class="admin-shell">{% include 'admin/_nav.html' %}<div class="admin-main"><div class="page-head"><div><span class="pill">People</span><h1>Teachers</h1><p>Create teacher accounts and view existing teachers.</p></div></div><section class="card"><form class="form-grid" method="post" action="{{url_for('add_teacher')}}"><input name="full_name" placeholder="Teacher full name" required><input type="email" name="email" placeholder="Teacher email" required><input type="password" name="password" placeholder="Temporary password" required><button class="btn">Create Teacher</button></form></section><section class="card"><h2>Teachers</h2>{% for t in teachers %}<div class="person"><div class="avatar">{{t.full_name[:1]|upper}}</div><div><b>{{t.full_name}}</b><small>{{t.email}}</small></div></div>{% else %}<p>No teachers.</p>{% endfor %}</section></div></div>{% endblock %}
