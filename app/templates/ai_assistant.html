{% extends "base.html" %}
{% block content %}
<div class="formbox" style="max-width: 780px; margin: 40px auto;">
  <h1>CampusHub AI Assistant</h1>
  <p>Ask only about this application and its features. It will not answer questions outside CampusHub.</p>

  <form method="post">
    <textarea name="question" rows="4" placeholder="Ask about registration, dashboards, community, teacher requests, or admin features..." required></textarea>
    <button class="btn" type="submit">Ask</button>
  </form>

  {% if answer %}
  <div class="card" style="margin-top: 20px; padding: 18px; border-radius: 12px; background: #f8fafc;">
    <h3>Answer</h3>
    <p>{{ answer }}</p>
  </div>
  {% endif %}
</div>
{% endblock %}
