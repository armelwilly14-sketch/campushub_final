{% extends "base.html" %}{% block content %}<div class="formbox"><h1>Login</h1><form method="post"><label for="account_type">Login as</label><select id="account_type" name="account_type"><option value="student">Student / Staff</option><option value="parent">Parent</option></select><label id="identity_label" for="identity">Email</label><input id="identity" name="identity" type="email" placeholder="Email" autocomplete="username" required><label for="password">Password</label><input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required><button class="btn">Login</button></form><p>Parent? <a href="{{ url_for('parent_register') }}">Create a parent account</a></p></div><script>const accountType=document.getElementById('account_type');const identity=document.getElementById('identity');const identityLabel=document.getElementById('identity_label');function updateLoginIdentity(){const parent=accountType.value==='parent';identity.type=parent?'text':'email';identity.name='identity';identity.placeholder=parent?"Child's matriculation number":"Email";identityLabel.textContent=parent?"Child's matriculation number":"Email";identity.autocomplete=parent?'off':'username'}accountType.addEventListener('change',updateLoginIdentity);updateLoginIdentity();</script>{% endblock %}
