{% extends "base.html" %}{% block content %}
<div class="page-head"><div><span class="pill">Private Chat</span><h1>💬 {{other.full_name}}</h1><p>Only you and {{other.full_name}} can see this conversation.</p></div><a class="btn" href="{{url_for('community')}}">← Community</a></div>
<section class="card chat-box"><div class="chat-messages">{% for m in messages %}<div class="chat-message {% if m.sender_id == session.get('user_id') %}mine{% endif %}"><small>{{m.sender_name}} • {{m.created_at}}</small><p>{{m.message}}</p></div>{% else %}<p>No messages yet.</p>{% endfor %}</div><form method="post"><textarea name="message" placeholder="Write a private message..." required></textarea><button class="btn">Send</button></form></section>
{% endblock %}
