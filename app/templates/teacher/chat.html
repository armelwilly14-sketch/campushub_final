{% extends "base.html" %}{% block content %}
<div class="page-head"><div><span class="pill">Approved Chat</span><h1>{{student.student_name}}</h1><p>Private conversation with the student.</p></div></div>
<section class="card chat-box"><div class="chat-messages">{% for m in messages %}<div class="chat-message {% if m.sender_id==session.get('user_id') %}mine{% endif %}"><b>{{m.sender_name}}</b><small>{{m.sender_role|capitalize}} • {{m.created_at}}</small><p>{{m.message}}</p></div>{% else %}<p>No messages yet.</p>{% endfor %}</div><form method="post"><textarea name="message" placeholder="Write your message..." required></textarea><button class="btn">Send Message</button></form></section>
{% endblock %}
